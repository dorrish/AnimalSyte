<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список необычных животных</title>
</head>
<body>
  <p>
    <a href="Page1.html">Необычные животные</a>
    <br><a href="list.html"><b>Список необычных животных</b></a>
  </p>
  <hr>
  <details open>
    <summary>График</summary>
    <form>
      <p><b>Значение по оси OX</b></p>

      <p>
        <label>
          <input type="radio" name="axis_x"
                 value="group" checked>
          Группа животных
        </label><br>

        <label>
          <input type="radio" name="axis_x"
                 value="diet">
          Тип питания
        </label><br>

        <label>
          <input type="radio" name="axis_x"
                 value="habitat">
          Среда обитания
        </label>
      </p>
      <p><b>Значение по оси OY</b></p>
      <p>
        <label>
          <input type="checkbox" name="count" value="yes" checked>Количество животных в таблице
        </label>
      </p>
      <input type="button" value="Построить">
    </form>
    <p>Здесь будет график</p>
  </details> 
  <details open>
    <summary>Фильтр</summary>
  <form>
    <p>
      <label>
        Название:
        <input type="text" name="name">
      </label>
    </p>
    <p>
      <label>
        Группа:
        <select name="group">
          <option value="">Все</option>
          <option value="Земноводные">Земноводные</option>
          <option value="Млекопитающие">Млекопитающие</option>
          <option value="Пресмыкающиеся">Пресмыкающиеся</option>
          <option value="Птицы">Птицы</option>
        </select>
      </label>
    </p>
    <p>
      <label>
        Тип питания:
        <select name="diet">
          <option value="">Все</option>
          <option value="Всеядное">Всеядное</option>
          <option value="Плотоядное">Плотоядное</option>
          <option value="Растительноядное">Растительноядное</option>
        </select>
      </label>
    </p>
  <p>
    <label>
      Среда обитания:
      <select name="habitat">
        <option value="">Все</option>
        <option value="Антарктические моря и льды">Антарктические моря и льды</option>
        <option value="Арктические моря">Арктические моря</option>
        <option value="Берега водоёмов">Берега водоёмов</option>
        <option value="Горные леса">Горные леса</option>
        <option value="Горные реки">Горные реки</option>
        <option value="Горы">Горы</option>
        <option value="Засушливые равнины">Засушливые равнины</option>
        <option value="Кустарниковые заросли">Кустарниковые заросли</option>
        <option value="Леса">Леса</option>
        <option value="Леса и кустарниковые заросли">Леса и кустарниковые заросли</option>
        <option value="Леса и луга">Леса и луга</option>
        <option value="Леса и открытые территории">Леса и открытые территории</option>
        <option value="Леса и редколесья">Леса и редколесья</option>
        <option value="Луга и кустарниковые заросли">Луга и кустарниковые заросли</option>
        <option value="Морские побережья">Морские побережья</option>
        <option value="Пресноводные болота">Пресноводные болота</option>
        <option value="Пресные водоёмы">Пресные водоёмы</option>
        <option value="Прибрежные леса">Прибрежные леса</option>
        <option value="Прибрежные морские воды">Прибрежные морские воды</option>
        <option value="Пустыни">Пустыни</option>
        <option value="Пустыни и полупустыни">Пустыни и полупустыни</option>
        <option value="Реки">Реки</option>
        <option value="Саванны">Саванны</option>
        <option value="Саванны и леса">Саванны и леса</option>
        <option value="Саванны и полупустыни">Саванны и полупустыни</option>
        <option value="Саванны и сухие леса">Саванны и сухие леса</option>
        <option value="Степи и каменистые склоны">Степи и каменистые склоны</option>
        <option value="Степи и полупустыни">Степи и полупустыни</option>
        <option value="Сухие леса">Сухие леса</option>
        <option value="Тропические леса">Тропические леса</option>
        <option value="Тундра">Тундра</option>
        <option value="Эвкалиптовые леса">Эвкалиптовые леса</option>
      </select>
    </label>
  </p>
    <input type="button" value="Найти">
    <input type="reset" value="Сбросить">
  </form>
  </details>
</body>
</html>
