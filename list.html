<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список необычных животных</title>
</head>
<body>
  <p>
    <a href="Page1.html">Необычные животные</a>
    <br><a href="list.html"><b>Список необычных животных</b></a>
  </p>
  <hr>
  <details open>
    <summary>График</summary>
    <form>
      <p><b>Значение по оси OX</b></p>

      <p>
        <label>
          <input type="radio" name="axis_x"
                 value="group" checked>
          Группа животных
        </label><br>

        <label>
          <input type="radio" name="axis_x"
                 value="diet">
          Тип питания
        </label><br>

        <label>
          <input type="radio" name="axis_x"
                 value="habitat">
          Среда обитания
        </label>
      </p>
      <p><b>Значение по оси OY</b></p>
      <p>
        <label>
          <input type="checkbox" name="count" value="yes" checked>Количество животных в таблице
        </label>
      </p>
      <input type="button" value="Построить">
    </form>
    <p>Здесь будет график</p>
  </details> 
  <details open>
    <summary>Фильтр</summary>
  </details>
  <form>
    <p>
      <label>
        Название:
        <input type="text" name="name">
      </label>
    </p>
    <p>
      <label>
        Группа:
        <select name="group">
          <option value="">Все</option>
          <option value="Земноводные">Земноводные</option>
          <option value="Млекопитающие">Млекопитающие</option>
          <option value="Пресмыкающиеся">Пресмыкающиеся</option>
          <option value="Птицы">Птицы</option>
        </select>
      </label>
    </p>
    <p>
      <label>
        Тип питания:
        <select name="diet">
          <option value="">Все</option>
          <option value="Всеядное">Всеядное</option>
          <option value="Плотоядное">Плотоядное</option>
          <option value="Растительноядное">Растительноядное</option>
        </select>
      </label>
    </p>
  </form>
</body>
</html>
